name: deploy page

# Publishes docs/ to GitHub Pages on pushes that change it, and when weekly.yml has published new data. The data
# isn't in the repo; it comes from the la-data release.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the data from the la-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download la-data --pattern la-data.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/la-data.tar.gz" -C docs
          else
            echo "::warning::no la-data release yet; the page will say its data didn't load"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
